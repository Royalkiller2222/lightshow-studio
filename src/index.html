<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Lightshow Studio</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<!-- Layout: top bar / [library | 3D view | inspector] / bottom area. The
     workspace (Build, Program) decides what the library, inspector and bottom
     area show; Simple/Pro decides how much detail they show. -->
<body class="pro-mode" data-ws="program">
  <header id="topbar"></header>

  <div id="workspace">
    <aside id="left" class="panel side" aria-label="Library">
      <div id="lib-build" class="panel-fill" data-ws-only="build"></div>
      <div id="lib-program" class="panel-fill" data-ws-only="program"></div>
      <div id="live-sections" class="panel-fill" data-ws-only="live"></div>
    </aside>
    <div class="split v" data-split="left" role="separator" aria-orientation="vertical" title="Drag to resize · double-click to hide"></div>

    <main id="center">
      <canvas id="view"></canvas>
      <div id="overlay"></div>
    </main>

    <div class="split v" data-split="right" role="separator" aria-orientation="vertical" title="Drag to resize · double-click to hide"></div>
    <aside id="right" class="panel side" aria-label="Inspector">
      <div id="inspector" class="panel-fill" data-ws-only="build program"></div>
      <div id="live-masters" class="panel-fill" data-ws-only="live"></div>
    </aside>
  </div>

  <div class="split h" data-split="bottom" role="separator" aria-orientation="horizontal" title="Drag to resize · double-click to hide"></div>
  <section id="bottom" class="panel" aria-label="Timeline and patch">
    <div id="patchsheet" class="panel-fill" data-ws-only="build"></div>
    <div id="timeline" class="panel-fill" data-ws-only="program"></div>
    <div id="livebar" class="panel-fill" data-ws-only="live"></div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
